name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint and structure checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check shell syntax on all .sh files
        run: |
          echo "Checking bash syntax..."
          find scripts/ modules/ -name "*.sh" | while read f; do
            bash -n "$f" && echo "  OK: $f" || { echo "  FAIL: $f"; exit 1; }
          done
          bash -n vault-demo && echo "  OK: vault-demo"

      - name: Check all scripts and modules are executable (100755)
        run: |
          echo "Checking exec bits in git index..."
          FAIL=0
          for f in scripts/*.sh modules/*.sh vault-demo; do
            MODE=$(git ls-files -s "$f" | awk '{print $1}')
            if [ "$MODE" != "100755" ]; then
              echo "  FAIL: $f is $MODE (expected 100755)"
              FAIL=1
            else
              echo "  OK: $f"
            fi
          done
          [ $FAIL -eq 0 ] || exit 1

      - name: Check YAML syntax
        run: |
          python3 -c "
          import sys, yaml, glob
          files = glob.glob('k8s/*.yaml') + glob.glob('k8s/*.yml')
          ok = True
          for f in files:
              try:
                  yaml.safe_load(open(f))
                  print(f'  OK: {f}')
              except Exception as e:
                  print(f'  FAIL: {f}: {e}')
                  ok = False
          sys.exit(0 if ok else 1)
          "

      - name: Confirm sensitive files are gitignored
        run: |
          echo "Checking .gitignore covers sensitive paths..."
          python3 -c "
          content = open('.gitignore').read()
          required = ['vault.hclic', '.vault-init.json', '.lab-state/']
          ok = True
          for r in required:
              if r in content:
                  print(f'  OK: {r} is gitignored')
              else:
                  print(f'  FAIL: {r} is NOT in .gitignore')
                  ok = False
          import sys; sys.exit(0 if ok else 1)
          "

      - name: Confirm no secrets in tracked files
        run: |
          echo "Scanning tracked files for accidental secrets..."
          # Fail if vault.hclic or .vault-init.json are tracked
          if git ls-files | grep -qE 'vault\.hclic|\.vault-init\.json'; then
            echo "FAIL: sensitive file is tracked by git"
            git ls-files | grep -E 'vault\.hclic|\.vault-init\.json'
            exit 1
          fi
          echo "  OK: no sensitive files tracked"
